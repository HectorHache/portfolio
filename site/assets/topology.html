<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network topology: hand-built, self-running</title>
<style>
  :root{ --ink:#111; --paper:#fff; --muted:#6b6b6b; --line:#c9c9c9; --accent:#2b6cb0; }
  html[data-theme="dark"]{ --ink:#e8e8e8; --paper:#0f1115; --muted:#9a9a9a; --line:#3a3a3a; --accent:#7db4e8; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:1100px; margin:0 auto; padding:20px 20px 8px; }
  svg{ width:100%; height:auto; display:block; }
  .node{ cursor:pointer; }
  .node rect{ fill:var(--paper); stroke:var(--ink); stroke-width:1.2; transition:stroke .15s, fill .15s; }
  .node .lab{ font-size:16px; letter-spacing:.05em; fill:var(--ink); font-weight:600; text-anchor:middle; }
  .node .sub{ font-size:12px; letter-spacing:.07em; fill:var(--muted); text-anchor:middle; text-transform:uppercase; }
  .node.accent rect{ stroke:var(--accent); stroke-width:1.8; }
  .edge{ stroke:var(--line); stroke-width:1.2; fill:none; opacity:.38; transition:stroke .15s, opacity .15s; }
  .edge .elab{ font-size:8px; letter-spacing:.1em; fill:var(--muted); text-transform:uppercase; }
  .node.dim{ opacity:.35; }
  .edge.hl{ stroke:var(--accent); stroke-width:1.8; opacity:1; }
  .edge.dim{ opacity:.06; }
  .band{ font-size:15px; letter-spacing:.14em; text-transform:uppercase; fill:var(--muted); }
  #detail{ min-height:40px; margin-top:6px; border-top:1px solid var(--line); padding-top:8px; font-size:13px; line-height:1.45; color:var(--ink); }
  #detail b{ font-weight:600; }
  #detail .muted{ color:var(--muted); }
  @media (max-width:640px){ .wrap{ padding:12px 12px 6px; } .node .lab{ font-size:13px; } .node .sub{ font-size:9.5px; } }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1000 506" role="img" aria-label="Interactive network topology: devices, the Mac Mini agent stack, and cloud services">
  <!-- BAND LABELS -->
  <text class="band" x="16" y="26">Devices</text>
  <text class="band" x="310" y="26">Mac Mini M4 Pro &middot; the stack</text>
  <text class="band" x="740" y="26">Cloud</text>

  <!-- ============ DEVICES ============ -->
  <g class="node" data-id="omarchy" data-name="Omarchy laptop" data-detail="AI-first Linux OS built by and for agents (David Heinemeier Hansson), customized with my own shell plugins; full agent-stack replica, karaoke, SSH into the Mac over Tailscale.">
    <rect x="16" y="80" width="210" height="60" rx="3"/>
    <text class="lab" x="121" y="104">Omarchy laptop</text>
    <text class="sub" x="121" y="129">AI-first OS</text>
  </g>
  <g class="node" data-id="family" data-name="Family devices" data-detail="Phones, tablets, laptops: resolve the private domain chat.hector.app through the tailnet DNS, no public exposure.">
    <rect x="16" y="170" width="210" height="60" rx="3"/>
    <text class="lab" x="121" y="194">Family devices</text>
    <text class="sub" x="121" y="212">tailnet private</text>
  </g>
  <g class="node" data-id="tv" data-name="Living-room TV" data-detail="The fun side of the network: projector-driven karaoke, media playback: same tailnet, different purpose.">
    <rect x="16" y="260" width="210" height="60" rx="3"/>
    <text class="lab" x="121" y="284">Living-room TV</text>
    <text class="sub" x="121" y="302">media · karaoke</text>
  </g>

  <!-- ============ MAC MINI (the stack) ============ -->
  <g class="node accent" data-id="macmini" data-name="Mac Mini M4 Pro: agent host" data-detail="The 24/7 self-running stack: multi-agent orchestration, bot fleet, household chat gateway, watchdogs. Self-healing, self-pruning, ~4.8 GB at idle.">
    <rect x="310" y="56" width="380" height="446" rx="4"/>
    <text class="lab" x="500" y="84">24/7 agent host</text>
  </g>

  <g class="node" data-id="herdr" data-name="herdr / omp" data-detail="Multi-agent orchestration: sessions resume at boot, processes pruned 34→8, each agent under its own shell. The boring part is the point: it just runs.">
    <rect x="360" y="105" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="129">herdr / omp</text>
    <text class="sub" x="500" y="147">orchestration</text>
  </g>
  <g class="node" data-id="hermes" data-name="Hermes fleet" data-detail="Telegram bot fleet: briefs, watchdogs, job-pipeline digests, family chats: scheduled crons deliver to the right DM every morning.">
    <rect x="360" y="167" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="191">Hermes fleet</text>
    <text class="sub" x="500" y="209">Telegram · cron</text>
  </g>
  <g class="node" data-id="owui" data-name="Open WebUI" data-detail="Chat·hector.app, the household AI gateway: Google SSO only, counts-only metrics, private by design.">
    <rect x="360" y="229" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="253">Open WebUI</text>
    <text class="sub" x="500" y="271">chat·hector.app</text>
  </g>
  <g class="node" data-id="bridge" data-name="Model bridge" data-detail="OpenAI-compatible bridge with JWT auto-refresh: routes to Vertex Gemini, falls back across providers, health-verifies every model.">
    <rect x="360" y="291" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="315">Model bridge</text>
    <text class="sub" x="500" y="333">router · fallback</text>
  </g>
  <g class="node" data-id="caddy" data-name="Caddy :443" data-detail="Root launch daemons terminate TLS on the tailnet IP: Let's Encrypt DNS-01 via Porkbun, TCC-safe env, self-healing.">
    <rect x="360" y="353" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="377">Caddy :443</text>
    <text class="sub" x="500" y="395">TLS · DNS-01</text>
  </g>
  <g class="node" data-id="watchdogs" data-name="Watchdogs" data-detail="Scheduled agents that audit the stack: drop campaigns, job postings, backup sync, provider health: problems surface, not just happen.">
    <rect x="360" y="415" width="280" height="54" rx="3"/>
    <text class="lab" x="500" y="439">Watchdogs</text>
    <text class="sub" x="500" y="457">drops · jobs</text>
  </g>

  <!-- ============ CLOUD ============ -->
  <g class="node" data-id="tailnet" data-name="Tailscale tailnet" data-detail="WireGuard mesh: devices reach the stack from anywhere, encrypted, with a private domain resolved only inside the tailnet.">
    <rect x="740" y="80" width="244" height="60" rx="3"/>
    <text class="lab" x="862" y="104">Tailscale tailnet</text>
    <text class="sub" x="862" y="122">WireGuard · magicDNS</text>
  </g>
  <g class="node" data-id="nextdns" data-name="NextDNS" data-detail="First configured as the tailnet ad-blocker; now also its nameserver with a Rewrite: chat.hector.app → 100.x tailnet IP. Private domain, public silence (NXDOMAIN outside).">
    <rect x="740" y="160" width="244" height="72" rx="3"/>
    <text class="lab" x="862" y="184">NextDNS</text>
    <text class="sub" x="862" y="202">ad-blocker · rewrites</text>
    <text class="sub" x="862" y="218">private DNS</text>
  </g>
  <g class="node" data-id="le" data-name="Let's Encrypt DNS-01" data-detail="TLS certificates issued via DNS-01 through the Porkbun API: no public A record needed, works over a dead NS-delegation feature.">
    <rect x="740" y="240" width="244" height="60" rx="3"/>
    <text class="lab" x="862" y="264">Let's Encrypt DNS-01</text>
    <text class="sub" x="862" y="282">Porkbun API · TXT only</text>
  </g>
  <g class="node" data-id="cfpages" data-name="Cloudflare Pages" data-detail="Public dashboards (drops.hector.app) deployed deterministically from git: byte-identical rebuilds, no surprises.">
    <rect x="740" y="315" width="244" height="60" rx="3"/>
    <text class="lab" x="862" y="344">Cloudflare Pages</text>
    <text class="sub" x="862" y="362">drops.hector.app</text>
  </g>
  <g class="node" data-id="llms" data-name="LLM APIs" data-detail="Vertex Gemini + 20+ providers behind the bridge: premium pools refresh on schedule, fallbacks cascade, health is verified per model.">
    <rect x="740" y="400" width="244" height="60" rx="3"/>
    <text class="lab" x="862" y="424">Vertex + LLM providers</text>
    <text class="sub" x="862" y="442">~380 models · health-verified</text>
  </g>

  <!-- ============ EDGES ============ -->
  <!-- devices → tailnet -->
  <g class="edge" data-src="omarchy" data-dst="tailnet"><line x1="226" y1="110" x2="740" y2="110"/></g>
  <g class="edge" data-src="family" data-dst="tailnet"><line x1="226" y1="200" x2="740" y2="124"/></g>
  <g class="edge" data-src="tv" data-dst="tailnet"><line x1="226" y1="290" x2="740" y2="138"/></g>
  <!-- tailnet → macmini -->
  <g class="edge" data-src="tailnet" data-dst="macmini"><line x1="740" y1="110" x2="690" y2="120"/></g>
  <!-- tailnet → nextdns (ad-blocker chain) -->
  <g class="edge" data-src="tailnet" data-dst="nextdns"><line x1="862" y1="140" x2="862" y2="160"/></g>
  <!-- macmini internal services → external -->
  <g class="edge" data-src="caddy" data-dst="le"><line x1="640" y1="380" x2="740" y2="270"/></g>
  <g class="edge" data-src="caddy" data-dst="nextdns"><line x1="640" y1="374" x2="740" y2="196"/></g>
  <g class="edge" data-src="bridge" data-dst="llms"><line x1="640" y1="318" x2="740" y2="430"/></g>
  <g class="edge" data-src="owui" data-dst="nextdns"><line x1="640" y1="256" x2="740" y2="196"/></g>
  <g class="edge" data-src="watchdogs" data-dst="cfpages"><line x1="640" y1="442" x2="740" y2="350"/></g>
</svg>

<div id="detail"><span class="muted">Hover or tap a node. This is the actual topology the stack runs on, hand-built before agents were the point.</span></div>
</div>

<script>
(function(){
  // theme sync (default dark; parent postMessage + localStorage)
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
  }
  function currentTheme(){ try{ return localStorage.getItem('pf-theme') || 'dark'; }catch(e){ return 'dark'; } }
  applyTheme(currentTheme());
  window.addEventListener('message', function(ev){ if (ev.data && ev.data.type === 'theme') applyTheme(ev.data.value); });
  window.addEventListener('storage', function(ev){ if (ev.key === 'pf-theme') applyTheme(ev.newValue || 'dark'); });

  // interactions
  var nodes=document.querySelectorAll('.node'), edges=document.querySelectorAll('.edge'), det=document.getElementById('detail');
  var map={}; nodes.forEach(function(n){ map[n.getAttribute('data-id')]=n; });
  function conn(id){ var out=[]; edges.forEach(function(e){ if(e.getAttribute('data-src')===id||e.getAttribute('data-dst')===id) out.push(e); }); return out; }
  function clear(){ nodes.forEach(function(n){ n.classList.remove('dim'); }); edges.forEach(function(e){ e.classList.remove('hl'); e.classList.remove('dim'); }); }
  function on(n){
    clear(); var id=n.getAttribute('data-id'); var cs=conn(id);
    var dn=document.querySelector('.edge[data-src="tailnet"][data-dst="nextdns"]');
    if(dn&&(id==='omarchy'||id==='family'||id==='tv')){ cs.push(dn); }
    cs.forEach(function(e){ e.classList.add('hl'); });
    nodes.forEach(function(m){ var mid=m.getAttribute('data-id'); var linked=cs.some(function(e){ return e.getAttribute('data-src')===mid||e.getAttribute('data-dst')===mid; });
      if(mid!==id&&!linked) m.classList.add('dim'); });
    det.innerHTML='<b>'+n.getAttribute('data-name')+'</b>: '+n.getAttribute('data-detail');
  }
  function off(){ clear(); det.innerHTML='<span class="muted">Hover or tap a node. This is the actual topology the stack runs on, hand-built before agents were the point.</span>'; }
  nodes.forEach(function(n){
    n.addEventListener('mouseenter',function(){ on(n); }); n.addEventListener('mouseleave',off);
    n.addEventListener('focus',function(){ on(n); }); n.addEventListener('blur',off);
    n.addEventListener('click',function(e){ e.stopPropagation(); on(n); });
  });
  document.addEventListener('click',function(){ clear(); });
})();
</script>
</body>
</html>
