<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Héctor Miguel — hector.app</title>
<meta name="description" content="hector.app — Héctor Miguel. AI engineering, operations discipline. Links: LinkedIn, GitHub, portfolio, dashboard, drops, dex.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1115">
<link rel="canonical" href="https://hector.app/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Cpath d='M18 16v32M46 16v32M18 32h28' stroke='%237db4e8' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#111;--ink-2:#333;--muted:#6b6b6b;--rule:#e2e2e2;--rule-2:#cfcfcf;
    --paper:#fff;--accent:#2b6cb0;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  html[data-theme="dark"]{
    --ink:#e8e8e8;--ink-2:#c9c9c9;--muted:#9a9a9a;--rule:#3a3a3a;--rule-2:#4a4a4a;
    --paper:#0f1115;--accent:#7db4e8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  main{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;padding:88px 24px 56px;
  }
  .kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);
  }
  h1{
    margin:16px 0 0;font-size:clamp(32px,7vw,46px);
    letter-spacing:-.02em;line-height:1.08;font-weight:650;
  }
  .sub{margin:14px 0 0;color:var(--ink-2);font-size:clamp(15px,2.4vw,17px)}
  .micro{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .actions{
    display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:10px 12px;
    margin:38px 0 0;max-width:640px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);
    border:1px solid var(--rule);border-radius:999px;padding:10px 20px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .pill:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .pill .arr{font-family:var(--mono);font-size:12px;opacity:.7}
  .pill.soon{opacity:.6;cursor:default;border-style:dashed}
  .pill.soon:hover{background:transparent;color:var(--ink);border-color:var(--rule)}
  .soon-tag{
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid currentColor;border-radius:999px;padding:1px 7px;opacity:.85;
  }
  .foot{
    margin:72px 0 0;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  /* theme toggle (top-right), same control as the portfolio */
  .theme{
    position:fixed;top:14px;right:14px;display:flex;gap:4px;
    background:var(--rule-2);border-radius:999px;padding:3px;
  }
  .knob{
    position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition:transform .18s ease;pointer-events:none;z-index:1;
  }
  .theme[data-active="light"] .knob{transform:translateX(30px)}
  .th{
    border:0;cursor:pointer;width:26px;height:26px;border-radius:50%;
    background:transparent;color:var(--muted);font-size:13px;line-height:1;
    display:grid;place-items:center;position:relative;z-index:2;transition:color .15s;
  }
  .th[aria-pressed="true"]{color:var(--ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main>
  <h1>Héctor Miguel</h1>
  <p class="sub">AI engineering &middot; operations discipline</p>
  <p class="micro">10+ years making +10.000-agent operations predictable. Today I build the agents.</p>

  <div class="actions">
    <a class="pill" href="https://www.linkedin.com/in/hectormm/" target="_blank" rel="noopener" aria-label="LinkedIn profile">LinkedIn<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://portfolio.hector.app" target="_blank" rel="noopener" aria-label="Portfolio">Portfolio<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://github.com/HectorHache" target="_blank" rel="noopener" aria-label="GitHub profile">GitHub<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://x.com/HectorEuclid" target="_blank" rel="noopener" aria-label="X (Twitter)">X<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://instagram.com/HectorEuclid" target="_blank" rel="noopener" aria-label="Instagram">Instagram<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://patreon.com/HectorHache" target="_blank" rel="noopener" aria-label="Patreon">Patreon<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://dash.hector.app" target="_blank" rel="noopener" aria-label="Live dashboard">Dashboard<span class="soon-tag">SHIPPING</span><span class="arr">&rarr;</span></a>
    <a class="pill" href="https://drops.hector.app" target="_blank" rel="noopener" aria-label="Twitch drops watchdog">Drops<span class="arr">&rarr;</span></a>
    <a class="pill" href="https://dex.hector.app" target="_blank" rel="noopener" aria-label="Kanto Pokédex">Dex<span class="arr">&rarr;</span></a>
  </div>

  <p class="foot">no trackers &middot; no cookies &middot; plain html</p>
</main>

<div class="theme" role="group" aria-label="Color theme" data-active="dark">
  <span class="knob" aria-hidden="true"></span>
  <button class="th" data-th="dark" aria-pressed="true" aria-label="Dark theme" title="Dark theme">&#9788;</button>
  <button class="th" data-th="light" aria-pressed="false" aria-label="Light theme" title="Light theme">&#9726;</button>
</div>

<script>
(function(){
  var KEY='hm-theme';
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    var pill=document.querySelector('.theme'); if(pill){ pill.setAttribute('data-active',t); }
    var knob=document.querySelector('.knob'); if(knob){ knob.style.transform = t==='light' ? 'translateX(30px)' : 'translateX(0)'; }
    document.querySelectorAll('.th').forEach(function(x){
      x.setAttribute('aria-pressed', x.getAttribute('data-th')===t ? 'true':'false');
    });
    try{ localStorage.setItem(KEY,t); }catch(e){}
  }
  var cur='dark';
  try{ cur=localStorage.getItem(KEY)||'dark'; }catch(e){}
  apply(cur);
  var pill=document.querySelector('.theme');
  if(pill){
    pill.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme')||'dark';
      apply(cur==='dark' ? 'light' : 'dark');
    });
  }
})();
</script>
</body>
</html>
